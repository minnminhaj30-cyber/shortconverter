name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend/frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend/frontend
        run: npm run build
      - name: Publish frontend at repository root
        run: |
          cp -R frontend/frontend/dist/. .
          touch .nojekyll
          git add -f index.html favicon.svg assets .nojekyll
          if git diff --cached --quiet; then
            echo "The published frontend is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build frontend for GitHub Pages"
          git push
      - name: Request GitHub Pages rebuild
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
